# ==============================================================
# template.yaml
#
# レンタルスタジオサーチアプリ — AWS SAM テンプレート
# CloudFormation スタック名: studio-search-app
# （釣行AIアプリ fishing-ai-app と同じAWSアカウント内に、完全に独立したスタックとして構築）
#
# 構成リソース:
#   - DynamoDB テーブル x7（Studios / Recommendations / Favorites / Posts / Chats / Usage / Users）
#   - Lambda 関数 x16（API系 x14 / バッチ系 x2 本体 + admin_trigger x2）
#   - API Gateway（明示的なAWS::Serverless::Apiリソース。Cognitoオーソライザーで一部エンドポイントを保護）
#   - Cognito User Pool + Google IdP（Hosted UI経由のGoogle認証）
#   - EventBridge スケジュール（毎日 AM6:00 JST）
#   - AWS Budgets（月次利用料アラート）
#
# デプロイ:
#   sam build -t infrastructure/template.yaml
#   sam deploy --stack-name studio-search-app --capabilities CAPABILITY_IAM
# ==============================================================

AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: Studio Search App - Serverless Backend

# ==============================================================
# パラメータ
# ==============================================================
Parameters:
  # ECS Fargateスケジュールタスク（空き状況スクレイピング）の実行先ネットワーク。
  # 専用VPCは構築せず、アカウントのデフォルトVPC・デフォルトサブネットを使う
  # （アウトバウンドのみのスクレイピング用途のため、これで十分）。
  # デプロイ時に実際のデフォルトVPC/サブネットIDを指定すること
  # （aws ec2 describe-vpcs --filters Name=is-default,Values=true で確認できる）。
  DefaultVpcId:
    Type: AWS::EC2::VPC::Id
    Description: "スクレイピングタスクを実行するVPC（通常はデフォルトVPC）"
  DefaultSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "スクレイピングタスクを実行するサブネット（パブリックサブネット、通常はデフォルトVPCの全サブネット）"

# ==============================================================
# グローバル設定
# ==============================================================
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        STUDIOS_TABLE: !Ref StudiosTable
        AVAILABILITY_TABLE: !Ref AvailabilityTable
        EVENTS_TABLE: !Ref EventsTable
        FAVORITES_TABLE: !Ref FavoritesTable
        POSTS_TABLE: !Ref PostsTable
        CHATS_TABLE: !Ref ChatsTable
        USAGE_TABLE: !Ref UsageTable
        USERS_TABLE: !Ref UsersTable
        ANALYTICS_TABLE: !Ref AnalyticsEventsTable
        UPLOADS_BUCKET: !Ref UploadsBucket

Resources:

  # ==============================================================
  # 認証基盤（Cognito User Pool + Google IdP、Hosted UI経由のGoogle認証）
  # ==============================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: studio-search-app-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "studio-search-app-${AWS::AccountId}"

  # Googleを外部IdPとして連携。client_id/secretはSSMに事前登録したものをデプロイ時に動的解決する。
  # client_secretは{{resolve:ssm-secure:...}}が使えないリソースのため、通常のString（非暗号化）
  # パラメータとして登録し {{resolve:ssm:...}} で解決する（釣行AIアプリと同じ注意点）。
  UserPoolGoogleIdP:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: "{{resolve:ssm:/studio-search/google-oauth-client-id}}"
        client_secret: "{{resolve:ssm:/studio-search/google-oauth-client-secret}}"
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: email
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolGoogleIdP
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [Google]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - http://localhost:5173/
        - https://d1c03ygthitldo.cloudfront.net/
        - https://studio-search-app.ryuchan-aws.workers.dev/
      LogoutURLs:
        - http://localhost:5173/
        - https://d1c03ygthitldo.cloudfront.net/
        - https://studio-search-app.ryuchan-aws.workers.dev/

  # ==============================================================
  # API Gateway
  # ==============================================================
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,DELETE,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ==============================================================
  # DynamoDB テーブル定義
  # ==============================================================

  StudiosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-studios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: studioId, AttributeType: S }
      KeySchema:
        - { AttributeName: studioId, KeyType: HASH }

  # 4ブランド（BUZZ/worcle/NOAH/スタジオミッション）のローカルスクレイピング結果を保存する。
  # PK: studioId（例: buzz-kichijoji-101st）, SK: date（YYYY-MM-DD）。
  # 1日単位で「その部屋・その日の全時間帯の空き/埋まり」をslots配列にまとめて1アイテムとして持つ。
  # ローカルのscrape_availability.pyから手動更新するのみで、Lambdaからの書き込みは行わない。
  AvailabilityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-availability
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: studioId, AttributeType: S }
        - { AttributeName: date, AttributeType: S }
      KeySchema:
        - { AttributeName: studioId, KeyType: HASH }
        - { AttributeName: date, KeyType: RANGE }

  FavoritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-favorites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: studioId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: studioId, KeyType: RANGE }

  # ユーザーが登録する「次のイベント」情報（ステージ実寸・出演人数）。
  # 1ユーザーが複数件登録・管理できるよう userId(PK) + eventId(SK) の複合キーとする。
  # このデータをもとに GetRecommendedStudiosFunction が「目的・日付・時間帯」の
  # 指定と組み合わせて、条件に合うスタジオ・部屋を絞り込む。
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: eventId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: eventId, KeyType: RANGE }

  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: postId, AttributeType: S }
      KeySchema:
        - { AttributeName: postId, KeyType: HASH }

  ChatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-chats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: chatId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: chatId, KeyType: RANGE }

  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-usage
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: dateKey, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: dateKey, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }

  # スタジオ詳細の表示（view_detail）・予約ボタンのクリック（click_reserve）を記録する。
  # 「予約完了」は外部サイト（スタジオ側）で行われるため実際には追跡できず、
  # ここで追えるのは「予約ページへのクリック」までである点に注意
  AnalyticsEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: studio-analytics-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: eventId, AttributeType: S }
      KeySchema:
        - { AttributeName: eventId, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ==============================================================
  # S3 バケット（スタジオ写真・投稿写真のアップロード先）
  # ==============================================================
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "studio-search-app-uploads-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET, PUT, POST]
            AllowedHeaders: ["*"]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${UploadsBucket.Arn}/*"

  # ==============================================================
  # Lambda 関数定義（API系）
  # ==============================================================

  GetStudiosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getStudiosHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref StudiosTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /studios
            Method: GET

  # GET /studios/{studioId}/availability?date=YYYY-MM-DD
  # ローカルスクリプトが書き込んだ4ブランドの空き状況を返す。指定日のデータが無ければ空配列を返す
  GetStudioAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getStudioAvailabilityHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref AvailabilityTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /studios/{studioId}/availability
            Method: GET

  # スタジオ詳細の表示・予約ボタンのクリックを記録する。未ログインでも計測できるよう
  # 認証は必須にしない（閲覧だけのユーザーの行動も知りたいため）
  PostAnalyticsEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.postAnalyticsEventHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AnalyticsEventsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /analytics/event
            Method: POST

  GetPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getPostsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PostsTable }
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts
            Method: GET

  GetFavoritesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getFavoritesHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref FavoritesTable }
        - DynamoDBReadPolicy: { TableName: !Ref StudiosTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /favorites
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CreateFavoriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.postFavoritesHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref FavoritesTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /favorites
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteFavoriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.deleteFavoritesHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref FavoritesTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /favorites/{studioId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # ==============================================================
  # /events — 「次のイベント」登録（ステージ実寸・出演人数・目的・日付・時間帯）
  # ==============================================================
  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getEventsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EventsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /events
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.postEventsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref EventsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /events
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.deleteEventHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref EventsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /events/{eventId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # GET /recommend-studios?eventId=...&purpose=...&date=...&startTime=...
  # イベント（ステージ実寸・人数）＋目的・日付・時間帯から、条件に合う部屋を持つ
  # スタジオを絞り込んで返す。認証不要（未ログインでもイベント無しでの絞り込みは
  # 将来的に許容する余地を残すため）だが、eventId指定時はそのユーザーの
  # イベントデータのみ参照できるよう認証必須にする
  GetRecommendedStudiosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getRecommendedStudiosHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EventsTable }
        - DynamoDBReadPolicy: { TableName: !Ref StudiosTable }
        - DynamoDBReadPolicy: { TableName: !Ref AvailabilityTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recommend-studios
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CreatePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.postPostsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PostsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  DeletePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.deletePostHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PostsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts/{postId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  UpdatePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.putPostHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PostsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts/{postId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  UpdateStudioImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.putStudioImageHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref StudiosTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /studios/{studioId}/image
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  PresignUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.postPresignUploadHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - S3WritePolicy: { BucketName: !Ref UploadsBucket }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /uploads/presign
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # POST /chat — 写真添付時はClaudeへマルチモーダル入力として渡すため、S3読み取り権限も付与
  # Timeoutは API Gateway の29秒上限より短く設定し、超過時もLambda側が先にエラーを返せるようにする
  PostChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.postChatHandler
      CodeUri: ../backend/lambda/api/
      Timeout: 25
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: studio-search/anthropic-api-key
        - S3ReadPolicy: { BucketName: !Ref UploadsBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref ChatsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }
        - DynamoDBReadPolicy: { TableName: !Ref StudiosTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chat
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  GetChatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getChatsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ChatsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chats
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  GetChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getChatHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ChatsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chats/{chatId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.deleteChatHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ChatsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chats/{chatId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  GetMyProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.getMyProfileHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /me
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  PutMyProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.putMyProfileHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /me
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # ==============================================================
  # Lambda 関数定義（バッチ系）
  # ==============================================================

  # 新規レンタルスタジオ候補を Google Places API で探索し、Studios テーブルに追加するバッチ
  # POST /admin/run-studio-discovery（フロントの「現在地から探す」ボタン）専用として、
  # ユーザーの現在地(lat/lng)を指定した近傍探索のためだけに呼び出される
  DiscoverStudiosBatch:
    Type: AWS::Serverless::Function
    Properties:
      Handler: discover_studios.handler
      CodeUri: ../backend/lambda/batch/
      # 候補ごとに最寄り駅検索・公式サイト取得・Claude呼び出しが増えたため延長
      Timeout: 300
      MemorySize: 256
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: studio-search/google-places-api-key
        - SSMParameterReadPolicy:
            ParameterName: studio-search/anthropic-api-key
        - DynamoDBCrudPolicy:
            TableName: !Ref StudiosTable
        - S3WritePolicy: { BucketName: !Ref UploadsBucket }

  # POST /admin/run-studio-discovery — フロントの「現在地から探す」ボタンから
  # DiscoverStudiosBatch を起動する（リクエストボディの lat/lng をそのまま転送する）
  AdminRunStudioDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: admin_trigger.handler
      CodeUri: ../backend/lambda/batch/
      Environment:
        Variables:
          BATCH_FUNCTION_NAME: !Ref DiscoverStudiosBatch
          RATE_LIMIT_ACTION: studio-discovery
          RATE_LIMIT_DAILY: "10"
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref DiscoverStudiosBatch }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/run-studio-discovery
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # AnalyticsEventsTableの前日分イベントを集計し、閲覧数・予約ボタンクリック数・
  # コンバージョン率（クリック数/閲覧数）をメールで通知する日次バッチ。
  # 「予約完了」自体は外部サイトで行われるため計測できず、あくまで
  # 「予約ページへのクリック」までのコンバージョンである点に注意
  SendAnalyticsDigestBatch:
    Type: AWS::Serverless::Function
    Properties:
      Handler: send_analytics_digest.handler
      CodeUri: ../backend/lambda/batch/
      Timeout: 60
      Environment:
        Variables:
          NOTIFY_EMAIL: ryuchan.aws@gmail.com
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref AnalyticsEventsTable }
        - DynamoDBReadPolicy: { TableName: !Ref StudiosTable }
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        # スコア計算バッチ（AM6:00 JST）の30分後に実行
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 21 * * ? *)
            Enabled: true

  # ==============================================================
  # 空き状況スクレイピング定期実行（ECS Fargate スケジュールタスク）
  #
  # backend/scripts/scrape_availability.py（4ブランド分をまとめて処理するhandler()）を
  # Playwright/Chromium入りのコンテナイメージとしてECS Fargateで毎日1回実行する。
  # Lambdaではなく Fargate を採用している理由:
  #   - 4ブランド全店舗×60日分の再取得はLambdaの15分実行時間上限を超える可能性がある
  #   - worcle/スタジオミッションはPlaywrightでのブラウザ操作が必須で、
  #     コンテナイメージが大きくなりがち（Lambdaのイメージサイズ上限は10GB、
  #     Fargateなら実質的な制約が緩い）
  #
  # コンテナイメージは infrastructure/scraper.Dockerfile からローカルでビルドし、
  # 手動でECRへpushする（このスタックはECRリポジトリの器だけを用意する。
  # SAM/CloudFormationからのコンテナビルドはできないため）。
  # ==============================================================

  ScraperEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: studio-search-scraper
      # コスト・整理のため、最新5世代のみ保持し古いイメージは自動削除する
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the last 5 images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
              "action": { "type": "expire" }
            }]
          }

  ScraperCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: studio-search-scraper-cluster

  # Fargateタスク実行ロール（ECRからのイメージ取得・CloudWatch Logsへの出力に必要）
  ScraperTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # タスク本体（scrape_availability.py）が使うロール。
  # DynamoDB（Studios/Availability）への読み書きとSSM（ミッションのログイン情報）読み取りが必要
  ScraperTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScraperTaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt StudiosTable.Arn
                  - !GetAtt AvailabilityTable.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/studio-search/mission-login-email"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/studio-search/mission-login-password"

  ScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/studio-search-scraper
      RetentionInDays: 14

  # コンテナイメージはinfrastructure/scraper.Dockerfileからローカルビルド・手動pushする前提のため、
  # タスク定義のImageは初回デプロイ時点でダミー値（:latest）を指す。
  # pushしたイメージがある状態で `aws ecs update-service` 等は不要（スケジュールタスクは
  # 実行のたびに最新のタスク定義を参照するため、次回実行から新イメージが使われる）
  ScraperTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: studio-search-scraper
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "3072"
      ExecutionRoleArn: !GetAtt ScraperTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ScraperTaskRole.Arn
      ContainerDefinitions:
        - Name: scraper
          Image: !Sub "${ScraperEcrRepository.RepositoryUri}:latest"
          Environment:
            - { Name: SCRAPE_DAYS_AHEAD, Value: "60" }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ScraperLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: scraper

  # デフォルトVPC内で実行する（専用VPC構築はコスト・複雑さに見合わないため）
  ScraperSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: studio-search-scraper task security group (outbound only)
      VpcId: !Ref DefaultVpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  # EventBridge SchedulerがECS RunTaskを呼び出すためのロール
  ScraperSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScraperSchedulerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ScraperTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ScraperTaskExecutionRole.Arn
                  - !GetAtt ScraperTaskRole.Arn

  # 毎日 AM6:00 JST（UTC 21:00）に4ブランド全店舗の空き状況を再取得する。
  # 前日実行分のスコア計算バッチ（廃止済み）と同じ時刻帯を踏襲
  ScraperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: studio-search-scraper-daily
      ScheduleExpression: cron(0 21 * * ? *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt ScraperCluster.Arn
        RoleArn: !GetAtt ScraperSchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref ScraperTaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              Subnets: !Ref DefaultSubnetIds
              SecurityGroups: [!Ref ScraperSecurityGroup]
              AssignPublicIp: ENABLED

  # ==============================================================
  # AWS利用料アラート（月$10、80%/100%到達時にメール通知）
  # Places等のGoogle Cloud側課金・Anthropic課金はAWS Budgetsでは検知できないため対象外
  # ==============================================================
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: studio-search-app-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: "10"
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: rfunao0955@gmail.com
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: rfunao0955@gmail.com

# ==============================================================
# スタック出力
# ==============================================================
Outputs:
  ApiEndpoint:
    Description: "API Gateway のエンドポイント URL（VITE_API_BASE_URL に設定すること）"
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UploadsBucketName:
    Description: "スタジオ写真・投稿写真のアップロード先S3バケット名"
    Value: !Ref UploadsBucket
  UserPoolId:
    Description: "Cognito User Pool ID（フロントエンドの src/auth/authConfig.ts に設定すること）"
    Value: !Ref UserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID（フロントエンドの src/auth/authConfig.ts に設定すること）"
    Value: !Ref UserPoolClient
  CognitoHostedUiDomain:
    Description: "Cognito Hosted UIのドメイン。Google Cloud ConsoleのOAuthクライアントで承認済みリダイレクトURIに <この値>/oauth2/idpresponse を登録すること"
    Value: !Sub "https://studio-search-app-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
